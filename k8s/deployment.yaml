apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: 729780141709.dkr.ecr.ap-northeast-1.amazonaws.com/dotnet:latest
        ports:
        - containerPort: 80